[package]
name = "tree-sitter-clojure-orchard"
description = "Parser for Clojure files"
version = "0.2.9"
authors = ["sogaiu"]
license = "CC0-1.0"
readme = "README.md"
keywords = ["incremental", "parsing", "tree-sitter", "clojure-orchard"]
categories = ["parser-implementations", "parsing", "text-editors"]
repository = "https://codeberg.org/grammar-orchard/tree-sitter-clojure-orchard"
edition = "2021"
autoexamples = false

build = "bindings/rust/build.rs"
include = [
  "bindings/rust/*",
  "grammar.js",
  "queries/*",
  "src/*",
  "tree-sitter.json",
  "/LICENSE",
]

[lib]
path = "bindings/rust/lib.rs"

[dependencies]
tree-sitter-language = "0.1"

[build-dependencies]
cc = "1.2"

[dev-dependencies]
tree-sitter = "0.26.12"
